<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé Vert Émeraude / Turquoise FinTech (Branche 1) -->
    <linearGradient id="tontiTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="50%" stop-color="#38B2AC" />
      <stop offset="100%" stop-color="#4FD1C5" />
    </linearGradient>

    <!-- Dégradé Or Solaire / Ambre (Branche 2) -->
    <linearGradient id="tontiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DD6B20" />
      <stop offset="50%" stop-color="#ED8936" />
      <stop offset="100%" stop-color="#F6AD55" />
    </linearGradient>

    <!-- Dégradé Cyan Émeraude Lumineux (Branche 3) -->
    <linearGradient id="tontiCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B6CB0" />
      <stop offset="50%" stop-color="#319795" />
      <stop offset="100%" stop-color="#4FD1C5" />
    </linearGradient>

    <!-- Dégradé Texte TontiNaïs -->
    <linearGradient id="tontiTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Définition géométrique d'une flèche rotative séparée avec respiration visuelle -->
    <path
      id="arrowSegment"
      d="M 123.6 128.2 
         A 184 184 0 0 1 364.2 107.1 
         L 375.9 91.0 
         L 380.6 165.5 
         L 317.1 171.9 
         L 328.9 155.7 
         A 124 124 0 0 0 166.8 169.9 
         L 174.4 125.4 
         Z"
    />

    <!-- Filtre ombre portée subtile -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#319795" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Groupe du Symbole Rotatif à 3 Branches Séparées -->
  <g transform="translate(0, -32)" filter="url(#subtleGlow)">
    <!-- Branche Supérieure (Émeraude / Turquoise) -->
    <use href="#arrowSegment" fill="url(#tontiTealGrad)" />

    <!-- Branche Droite / Inférieure (Or Solaire) -->
    <use href="#arrowSegment" fill="url(#tontiGoldGrad)" transform="rotate(120 256 256)" />

    <!-- Branche Gauche / Inférieure (Cyan / Émeraude) -->
    <use href="#arrowSegment" fill="url(#tontiCyanGrad)" transform="rotate(240 256 256)" />
  </g>

  <!-- Typographie Officielle avec Empattements (Serif) -->
  <text
    x="256"
    y="442"
    text-anchor="middle"
    font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif"
    font-weight="700"
    font-size="64"
    letter-spacing="-0.5px"
  >
    <tspan fill="#F8FAFC">Tonti</tspan><tspan fill="url(#tontiTextGrad)">Naïs</tspan>
  </text>
</svg>
